name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: node scripts/check-release.mjs
      - run: npx expo export --platform all
