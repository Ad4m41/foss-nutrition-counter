name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - name: Validate tag and credentials
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          test -n "$EXPO_TOKEN" || { echo 'Add the EXPO_TOKEN repository secret.'; exit 1; }
      - name: Build signed standalone APK with EAS
        run: npx eas-cli@24.10.0 build --platform android --profile release --non-interactive --wait --json > build.json
      - name: Download APK and create draft release
        run: node scripts/github-release.mjs build.json "$GITHUB_REF_NAME"
